# Public IP HTTPS preview only. Add as a separate file; preserve production and loopback blocks.
# TLS certificate/key and trusted proxy snippet are provisioned privately by the deployment owner.
# No default_server and no hosted-domain server names. Confirm port 443 is unused before installing.
server {
    listen 80;
    server_name 134.175.136.31;
    # Dedicated webroot contains ONLY ACME challenge files, never app/source/backup data.
    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        root /srv/xuebabangbang-unified-preview/acme-webroot;
        default_type text/plain;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }
    location / { return 308 https://134.175.136.31$request_uri; }
}
server {
    listen 443 ssl;
    server_name 134.175.136.31;
    ssl_certificate /srv/xuebabangbang-unified-preview/ip-tls/live/134.175.136.31/fullchain.pem;
    ssl_certificate_key /srv/xuebabangbang-unified-preview/ip-tls/live/134.175.136.31/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    autoindex off;
    disable_symlinks on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Keep ordinary prefixes (not ^~): these regex guards must run before static aliases.
    location ~ (^|/)\. { return 404; }
    location ~* (^|/)(?:node_modules|tests?|__tests__|fixtures|scripts|ops|src|lib|components|docs|drizzle|backups|mail-outbox|ip-tls)(?:/|$) { return 404; }
    location ~* (^|/)(?:AGENTS\.md|README(?:\.[^/]+)?|Dockerfile|package(?:-lock)?\.json|tsconfig(?:\.[^/]+)?\.json|compose[^/]*\.ya?ml|drizzle\.config\.[^/]+)$ { return 404; }
    location ~* ^/(?:hanzi|guwen|taskhelper)/app(?:/|$) { return 404; }
    location ~* (?:\.(?:ts|tsx|map|sql|sh|cjs|mjs|env|toml|dump|bak|log)|\.(?:test|spec)\.js)$ { return 404; }

    location = /hanzi { return 308 /hanzi/; }
    location = /guwen { return 308 /guwen/; }
    location = /taskhelper { return 308 /taskhelper/; }

    # Exact widget locations keep their prefix and use a single existing public HTML file.
    # Query strings such as ?embedded=1 do not affect exact location matching.
    location = /hanzi/parent.html {
        alias /srv/xuebabangbang-unified-preview/hanzi/parent.html;
        add_header Content-Security-Policy "frame-ancestors https://134.175.136.31" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /guwen/parent.html {
        alias /srv/xuebabangbang-unified-preview/guwen/parent.html;
        add_header Content-Security-Policy "frame-ancestors https://134.175.136.31" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /hanzi/ {
        alias /srv/xuebabangbang-unified-preview/hanzi/;
        index welcome.html;
    }
    location /guwen/ {
        alias /srv/xuebabangbang-unified-preview/guwen/;
        index index.html;
    }
    location /taskhelper/ {
        # Export must be built with NEXT_PUBLIC_TOOL_BASE=/taskhelper.
        alias /srv/xuebabangbang-unified-preview/taskhelper/out/;
        index index.html;
    }
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host 134.175.136.31;
        proxy_set_header X-Forwarded-Host 134.175.136.31;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # This private snippet overwrites x-xbb-proxy-secret and x-xbb-client-ip.
        # Never substitute/pass through values supplied by the browser.
        include /etc/nginx/snippets/xueba-unified-preview-proxy.conf;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
