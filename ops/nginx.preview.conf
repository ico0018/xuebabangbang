# Install as a separate file; never replace existing production server blocks.
# All preview listeners are loopback-only, reachable through the SSH tunnel.
server {
    listen 127.0.0.1:8320;
    server_name localhost;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 127.0.0.1:8321;
    server_name localhost;
    root /srv/xuebabangbang-unified-preview/hanzi;
    index welcome.html;
    client_max_body_size 2m;
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host localhost:8320;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ /\. { deny all; }
    location ~* ^/(?:AGENTS\.md|README\.md|ops/|tests/|scripts/) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
